[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatui"
version = "0.1.0"
description = "BlackRainLabs Hybrid Active Directory Terminal UI — dark chrome admin console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlackRainLabs" }]
dependencies = [
    "textual>=1.0.0",
    "pydantic>=2.6",
    "ldap3>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
hatui = "hatui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hatui = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
